  :root[data-theme] body { background-attachment: fixed; }
  .swatch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .swatch button { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 4px; font-size: 13px; }
  .swatch button.on { border-color: var(--ink); font-weight: 700; } .swatch i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 6px; }
  .icons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; } .icons button { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 4px; font-size: 13px; }
  .icons button.on { border-color: var(--ink); font-weight: 700; } .icons img { display: block; width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 14px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input, select { font: inherit; color: var(--ink); background: var(--card); }
  /* 모바일: 탭은 엄지가 닿는 화면 아래쪽에 */
  header { background: var(--card); border-top: 1px solid var(--line); position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  body.typing header { display: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  nav { display: grid; grid-template-columns: repeat(5, 1fr); }
  nav button { border: 0; background: none; padding: 7px 0 8px; color: var(--sub); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  nav button .i { font-size: 21px; filter: grayscale(1); opacity: .55; }
  nav button.on { color: var(--ink); font-weight: 700; }
  nav button.on .i { filter: none; opacity: 1; }
  main.wrap { padding-top: calc(28px + env(safe-area-inset-top)); padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
  main.wrap.rec { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .muted { color: var(--sub); font-size: 13px; }
  .ttop { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 4px 12px; }
  .ttop h1 { font-size: 22px; margin: 0; }
  .tadd { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .tadd #wText { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; font-size: 17px; padding: 6px 2px 10px; color: var(--ink); outline: none; }
  .tadd #wText:focus { border-bottom-color: var(--ink); }
  .trow { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; margin-top: 10px; align-items: center; }
  .trow select { width: auto; max-width: 120px; }
  .tplus { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: var(--card); font-size: 22px; line-height: 1; }
  .tsec { background: var(--card); border-radius: 18px; padding: 6px 14px 4px; margin-bottom: 12px; border-left: 4px solid var(--g); }
  .thead { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 6px; font-weight: 700; font-size: 15px; }
  .titem { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .tchk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: none; padding: 0; }
  .tchk:active { background: var(--g); border-color: var(--g); }
  .temo { font-size: 18px; margin: 0 -4px 0 -2px; }
  .tname { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tprice { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tdel { border: 0; background: none; color: var(--sub); font-size: 13px; padding: 4px; opacity: .6; }
  .wamt { position: relative; }
  .wamt input { width: 100%; font-size: 18px; font-weight: 700; text-align: right; padding-right: 30px; font-variant-numeric: tabular-nums; }
  .wamt span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--sub); }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* 기록 */
  .amount { display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 10px 0 4px; }
  .amount input { border: 0; outline: 0; background: none; font-size: 40px; font-weight: 800; field-sizing: content; min-width: 1.2ch; max-width: 100%; text-align: center; }
  .amount input::placeholder { color: var(--line); }
  .amount span { font-size: 20px; color: var(--sub); }
  .pills { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .pill { border: 0; background: var(--soft); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--sub); }
  .pill.set { color: var(--ink); font-weight: 700; }
  .box { background: var(--soft); border-radius: 12px; padding: 12px; margin: -4px 0 14px; }
  .mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; }
  .mcal span { padding: 4px 0; font-size: 11px; }
  .mcal button { border: 0; background: none; border-radius: 8px; padding: 7px 0; }
  .mcal button.today { font-weight: 800; text-decoration: underline; }
  .mcal button.on { background: var(--ink); color: var(--card); }
  .mcal button.in { background: color-mix(in srgb, var(--ink) 12%, var(--card)); }
  .due { background: #fff6e0; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
  .due .between { padding: 6px 0 0; } .due .due-i { color: var(--ink); text-decoration: none; text-align: left; } .due .on .due-i { font-weight: 800; }
  .glabel { font-size: 12px; color: var(--sub); margin: 14px 0 6px; }
  [data-lp] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .chip.edit { padding-right: 6px; } .chip.edit .x { margin-left: 4px; color: var(--bad); font-size: 12px; }
  .hscroll { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; } .hscroll .chip { flex: none; }
  .titem.editing, .tadd.editing { box-shadow: 0 0 0 2px var(--ink); border-radius: 12px; }
  [data-sortkey] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sorting [data-sortkey] { outline: 1px dashed var(--sub); outline-offset: 1px; }
  [data-sortkey].dragging { opacity: .55; transform: scale(1.08); outline: 2px solid var(--ink); }
  .cycb { display: inline-block; font-size: 10px; font-weight: 800; line-height: 1; padding: 3px 5px; border-radius: 5px; color: #fff; vertical-align: 2px; margin-left: 4px; }
  .calc { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 6px 0 8px; }
  .calc button { border: 0; background: var(--soft); border-radius: 12px; padding: 9px 0; font-size: 19px; font-weight: 700; color: var(--ink); }
  .calc button:last-child { background: var(--ink); color: var(--card); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 10px 4px 8px; text-align: center; }
  .tile .e { font-size: 22px; display: block; }
  .tile .t { font-size: 13px; display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--card)); font-weight: 700; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 10px; border-radius: 12px; background: color-mix(in srgb, var(--c) 7%, var(--card)); }
  .chip { white-space: nowrap; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }

  '입력한 기록은 이 폰 안에만 저장되고 어디로도 보내지 않아요. 인터넷 권한도 쓰지 않아요.': ['Your records stay on this phone and are never sent anywhere. The app has no internet permission.', '记录只保存在本机，不会发送到任何地方。应用不使用网络权限。'],

  '저장하지 못했어요. 폰 저장 공간을 확인해 주세요': ['Could not save. Check your phone storage.', '保存失败，请检查手机存储空间。'], '저장된 기록을 읽지 못했어요. 원본은 따로 보관해 두었어요': ['Could not read saved records. The original was kept aside.', '无法读取已保存的记录，原始数据已另行保存。'], '백업이 너무 커요': ['Backup is too large', '备份过大'],
  '예산 등록': ['Add budget', '添加预算'], '화폐': ['Currency', '货币'], '하위 ›': ['Sub ›', '细分 ›'], '연핑크': ['Light pink', '浅粉'], '연보라': ['Lavender', '浅紫'], '하늘색': ['Sky blue', '天蓝'], '민트': ['Mint', '薄荷'], '무늬': ['Patterns', '图案'], '민초 도트': ['Mint choco dots', '薄荷巧克力波点'], '핑크브라운 도트': ['Pink brown dots', '粉棕波点'], '네이비 도트': ['Navy dots', '藏青波点'], '리본': ['Ribbons', '蝴蝶结'], '체리': ['Cherry', '樱桃'], '심플': ['Simple', '简约'], '저금통': ['Piggy bank', '存钱罐'], '묶음 예산': ['Combined budgets', '合并预算'], '＋ 여러 개 묶기': ['＋ Combine several', '＋ 合并多项'], '묶을 항목': ['Items to combine', '要合并的项目'], '즐겨찾기': ['Favorite', '收藏'], '🔁 반복 지출 수정': ["🔁 Save recurring", "🔁 保存定期支出"], '반복 지출을 수정했어요': ["Recurring expense updated", "已修改定期支出"], '반복 지출을 등록했어요': ["Recurring expense added", "已添加定期支出"], '끝나는 달이 시작보다 빨라요': ["End month is before start", "结束月份早于开始"], '말일': ["last day", "最后一天"], '예)': ["e.g.", "例如"], '① 금액 입력': ["① Enter the amount", "① 输入金额"], '맨 위 숫자를 누르면 숫자 키패드가 떠요. 쓴 돈을 입력해요.': ["Tap the number at the top to open the keypad, then type what you spent.", "点击顶部数字会弹出数字键盘，输入花费的金额。"], '점심 9,000원 → 9000 입력': ["Lunch ₩9,000 → type 9000", "午饭9,000韩元 → 输入9000"], '② 카테고리 고르기': ["② Pick a category", "② 选择类别"], '카테고리 칸을 누르면 아래에 세부 항목(외식·카페 등)이 나와요. 세부 항목은 안 골라도 돼요.': ["Tap a category to show its sub-items (dining out, cafe…) below. Picking a sub-item is optional.", "点击类别后下方会出现细项（外食、咖啡等），细项可以不选。"], '🍚 식비 → 외식': ["🍚 Food → Dining out", "🍚 餐饮 → 外食"], '📅 날짜 바꾸기': ["📅 Change the date", "📅 更改日期"], '기본은 오늘이에요. 눌러서 어제나 다른 날로 바꿀 수 있어요.': ["It's today by default. Tap to switch to yesterday or another day.", "默认为今天，点击可改为昨天或其他日期。"], '어제 산 택시비 → 📅 → 어제': ["Yesterday's taxi → 📅 → Yesterday", "昨天的打车费 → 📅 → 昨天"], '📝 상세': ["📝 Details", "📝 详情"], '품목명·브랜드·구매처·수량을 적어요. 수량 옆에서 개·g·kg·ml·L를 골라요. 적어 두면 비교 탭에서 단가를 볼 수 있어요.': ["Add item, brand, store and quantity. Pick pcs·g·kg·ml·L next to the quantity. Then you can see unit prices in the Compare tab.", "填写品名、品牌、购买处和数量，在数量旁选择个·g·kg·ml·L。这样就能在比价页查看单价。"], '돼지고기 · 마트 · 600 g': ["Pork · Mart · 600 g", "猪肉 · 超市 · 600 g"], '③ 기록하기': ["③ Record", "③ 记录"], '맨 아래 버튼을 누르면 저장돼요. 잘못 눌렀으면 아래 알림의 [되돌리기]를 누르세요.': ["Tap the bottom button to save. If it was a mistake, tap [Undo] on the notice below.", "点最下方按钮即可保存。按错了就点下方提示里的[撤销]。"], '🍚 식비 · 외식 9,000원 기록': ["🍚 Food · Dining out ₩9,000 recorded", "🍚 餐饮 · 外食 9,000韩元 已记录"], '⭐ 즐겨찾기 · 🔁 반복 지출': ["⭐ Favorites · 🔁 Recurring", "⭐ 收藏 · 🔁 定期支出"], '자주 쓰는 기록은 ⭐ 즐겨찾기 추가, 매달 나가는 돈은 🔁 반복 지출 추가. 반복 지출은 시작·종료 달을 정하면 그날 자동으로 기록돼요.': ["Use ⭐ Add favorite for frequent records and 🔁 Add recurring for monthly bills. Set start and end months and they're recorded automatically on that day.", "常用记录点⭐添加收藏，每月固定支出点🔁添加定期支出。设好开始和结束月份后，到日子会自动记录。"], '월세 55만원 · 매달 25일 · 2026.01~2026.12': ["Rent ₩550,000 · 25th monthly · 2026.01~2026.12", "房租55万韩元 · 每月25日 · 2026.01~2026.12"], '📅 달력': ["📅 Calendar", "📅 日历"], '날짜를 누르면 아래에 그날 기록이 나와요. 숫자는 그날 쓴 돈, 그림은 한 푼도 안 쓴 무지출 날이에요. 무지출 그림은 위쪽 그림을 눌러 바꿔요.': ["Tap a date to see that day's records below. Numbers are what you spent; the icon marks no-spend days. Tap the icon at the top to change it.", "点日期，下方会显示当天记录。数字是当天花费，图标表示无支出日。点上方图标可更换。"], '이번 달 무지출 6일': ["6 no-spend days this month", "本月无支出6天"], '✏️ 기록 고치기': ["✏️ Fix records", "✏️ 修改记录"], '기록을 누르면 수정, 꾹 누르면 여러 개를 고를 수 있어요. 고른 뒤 [삭제] [카테고리 변경] [합치기]를 눌러요.': ["Tap a record to edit it; long-press to select several. Then tap [Delete], [Change category] or [Merge].", "点记录可修改，长按可多选。选好后点[删除][更改类别][合并]。"], '커피 2건을 꾹 눌러 고르고 → 합치기': ["Long-press 2 coffees → Merge", "长按选中2笔咖啡 → 合并"], '📊 분석': ["📊 Analysis", "📊 分析"], '위 버튼으로 지출 · 예산 · 비교를 바꿔 봐요. 지출은 주간·월간·분기·연간 원형 차트, 조각을 누르면 그 기록 목록이 나와요.': ["Switch between Spending · Budget · Compare at the top. Spending shows weekly to yearly pie charts; tap a slice to list its records.", "用上方按钮切换支出·预算·比价。支出是周/月/季/年饼图，点扇区可看记录列表。"], '이번 달 식비가 몇 %인지 보기': ["See what % of this month went to food", "查看本月餐饮占比"], '🎯 예산': ["🎯 Budget", "🎯 预算"], '[＋ 예산 등록]으로 대분류나 카테고리에 월간·분기·연간 예산을 만들어요. 대분류 예산은 그 안 카테고리 예산 합계 이상이에요. 줄을 누르면 하위 예산, 꾹 누르면 수정해요.': ["Use [＋ Add budget] to set monthly, quarterly or yearly budgets for a group or category. A group budget is at least the sum of its category budgets. Tap a row for sub-budgets, long-press to edit.", "用[＋ 添加预算]为大类或类别设置月/季/年预算。大类预算不少于其下类别预算合计。点行查看下级预算，长按修改。"], '변동지출 월 80만원 · 그 안에 식비 40만원': ["Variable ₩800,000/month · Food ₩400,000 inside", "变动支出每月80万 · 其中餐饮40万"], '🔍 비교': ["🔍 Compare", "🔍 比价"], '마트에서 가격과 용량을 넣으면 100g당·개당 가격으로 바꿔서 가장 싼 것에 👍를 달아요. 위에서 품목을 누르면 예전에 산 가격과도 비교해요.': ["At the store, enter price and size to get per 100g or per-piece prices; the cheapest gets 👍. Tap an item above to compare with what you paid before.", "在超市输入价格和容量，会换算成每100g/每个的价格，最便宜的标👍。点上方品项还能与以前买的价格比较。"], 'A 8,900원 500g  vs  B 15,800원 1kg': ["A ₩8,900 500g  vs  B ₩15,800 1kg", "A 8,900韩元 500g  vs  B 15,800韩元 1kg"], '🛍️ 사고 싶은 것': ["🛍️ Wish list", "🛍️ 心愿单"], '이름·금액·카테고리를 넣고 ＋를 눌러요. 다 사면 그 예산이 얼마 남는지(여유)·넘는지(초과) 보여줘요. 샀으면 동그라미를 눌러 바로 기록해요.': ["Enter name, price and category, then tap ＋. It shows how much budget would be left (to spare) or over if you bought it all. Bought it? Tap the circle to record it.", "输入名称、金额、类别后点＋。会显示全部买下后预算富余或超支多少。买了就点圆圈直接记录。"], '겨울 코트 189,000원 → 생활': ["Winter coat ₩189,000 → Living", "冬季大衣189,000韩元 → 生活"], '⚙️ 설정': ["⚙️ Settings", "⚙️ 设置"], '테마·무늬·앱 아이콘·🔒 앱 잠금·백업을 바꿔요. 이 사용법은 설정 맨 아래 📖 사용법 보기로 다시 볼 수 있어요.': ["Change theme, pattern, app icon, 🔒 app lock and backup. See this guide again via 📖 How to use at the bottom of Settings.", "可更改主题、图案、应用图标、🔒应用锁和备份。设置底部的📖使用说明可再次查看本教程。"], '앱 잠금 → 비밀번호 4자리': ["App lock → 4-digit PIN", "应用锁 → 4位密码"], '📱 위젯': ["📱 Widgets", "📱 小组件"], '홈 화면 빈 곳을 꾹 누르고 위젯 → 쉬운가계부에서 지출·사고 싶은 것 위젯을 놓아요. 위젯을 꾹 누르면 설정을 바꿀 수 있어요.': ["Long-press an empty spot on your home screen → Widgets → Easy Budget, and place the Spending or Wish list widget. Long-press a widget to change its settings.", "长按主屏幕空白处 → 小组件 → 简易记账，放置支出或心愿单小组件。长按小组件可更改设置。"], '지출 위젯 → 변동지출 · 월간': ["Spending widget → Variable · Monthly", "支出小组件 → 变动支出 · 每月"], '최근': ["Latest", "最近"], '카테고리 변경': ["Change category", "更改类别"], '카테고리를 바꿨어요': ["Category changed", "已更改类别"], '앱 잠금': ["App lock", "应用锁"], '끔': ["Off", "关闭"], '비밀번호': ["PIN", "密码"], '지문·얼굴': ["Fingerprint · face", "指纹·面容"], '비밀번호 바꾸기': ["Change PIN", "更改密码"], '비밀번호를 입력하세요': ["Enter your PIN", "请输入密码"], '새 비밀번호 4자리': ["New 4-digit PIN", "新的4位密码"], '한 번 더 입력하세요': ["Enter it once more", "请再输入一次"], '지금 비밀번호를 입력하세요': ["Enter your current PIN", "请输入当前密码"], '비밀번호가 달라요': ["PIN doesn't match", "密码不一致"], '비밀번호를 정했어요': ["PIN set", "已设置密码"], '📖 사용법 보기': ["📖 How to use", "📖 使用说明"], '쉬운가계부': ["Easy Budget", "简易记账"], '다음': ["Next", "下一步"], '시작하기': ["Get started", "开始使用"], '금액을 입력해요': ["Enter the amount", "输入金额"], '카테고리를 고르고 아래 버튼을 누르면 기록돼요': ["Pick a category and tap the button below to record", "选择类别后点下方按钮即可记录"], '품목명·수량을 적어 두면 비교 탭에서 단가를 비교할 수 있어요': ["Add the item name and quantity to compare unit prices in the Compare tab", "填写品名和数量，就能在比价页比较单价"], '날짜를 누르면 그날 기록이 나와요. 기록을 꾹 누르면 여러 개를 골라 삭제·합치기·카테고리 변경을 할 수 있어요': ["Tap a date to see that day's records. Long-press a record to select several and delete, merge or change category", "点日期查看当天记录。长按记录可多选，进行删除、合并或更改类别"], '지출·예산·비교를 볼 수 있어요. 예산 줄을 누르면 하위 예산, 꾹 누르면 수정이에요': ["See spending, budgets and price comparisons. Tap a budget row for its sub-budgets, long-press to edit", "可查看支出、预算和比价。点预算行查看下级预算，长按可修改"], '사고 싶은 것을 적어 두면 남은 예산과 비교해 줘요': ["Add things you want to buy and see them against your remaining budget", "记下想买的东西，会和剩余预算对比"], '테마·앱 잠금·백업은 설정에서 바꿔요. 홈 화면을 꾹 눌러 위젯도 추가해 보세요': ["Change themes, app lock and backups in Settings. Long-press your home screen to add widgets too", "主题、应用锁和备份在设置中更改。长按主屏幕还可以添加小组件"], '가격 비교': ['Price check', '比价'], '가격': ['Price', '价格'], '수량·중량': ['Qty·weight', '数量·重量'], '지우기': ['Clear', '清除'], '👍 최저': ['👍 Cheapest', '👍 最便宜'], '100g당': ['per 100g', '每100g'], '100ml당': ['per 100ml', '每100ml'], '앱에서만 바꿀 수 있어요': ['Only in the Android app', '仅在安卓应用中可更改'],

i tên món và số lượng để so sánh đơn giá ở tab So sánh", "सामानको नाम र परिमाण लेखे तुलना ट्याबमा एकाइ मूल्य तुलना गर्न सकिन्छ"], "날짜를 누르면 그날 기록이 나와요. 기록을 꾹 누르면 여러 개를 골라 삭제·합치기·카테고리 변경을 할 수 있어요": ["Нажмите на дату, чтобы увидеть записи. Удерживайте запись, чтобы выбрать несколько и удалить, объединить или сменить категорию", "Chạm vào ngày để xem ghi chép. Nhấn giữ một ghi chép để chọn nhiều mục rồi xóa, gộp hoặc đổi danh mục", "मिति थिच्दा त्यो दिनको रेकर्ड देखिन्छ। रेकर्ड थिचिराख्दा धेरै छानेर मेटाउन, जोड्न वा वर्ग बदल्न सकिन्छ"], "지출·예산·비교를 볼 수 있어요. 예산 줄을 누르면 하위 예산, 꾹 누르면 수정이에요": ["Здесь расходы, бюджеты и сравнение цен. Нажмите строку бюджета — подбюджеты, удерживайте — изменить", "Xem chi tiêu, ngân sách và so sánh giá. Chạm dòng ngân sách để xem ngân sách con, nhấn giữ để sửa", "खर्च, बजेट र तुलना हेर्न सकिन्छ। बजेट पङ्क्ति थिच्दा उप-बजेट, थिचिराख्दा सम्पादन"], "사고 싶은 것을 적어 두면 남은 예산과 비교해 줘요": ["Запишите желаемые покупки — и сравните их с остатком бюджета", "Ghi những thứ muốn mua để so với ngân sách còn lại", "किन्न चाहेका कुरा लेखे बाँकी बजेटसँग तुलना गरिन्छ"], "테마·앱 잠금·백업은 설정에서 바꿔요. 홈 화면을 꾹 눌러 위젯도 추가해 보세요": ["Темы, блокировка и резервные копии — в настройках. Удерживайте главный экран, чтобы добавить виджеты", "Đổi giao diện, khóa ứng dụng và sao lưu trong Cài đặt. Nhấn giữ màn hình chính để thêm tiện ích", "थिम, एप लक र ब्याकअप सेटिङमा बदल्नुहोस्। होम स्क्रिन थिचिराखेर विजेट पनि थप्नुहोस्"], "반복 지출을 등록했어요": ["Повторный расход добавлен", "Đã thêm chi tiêu định kỳ", "दोहोरिने खर्च थपियो"], "끝나는 달이 시작보다 빨라요": ["Конец раньше начала", "Tháng kết thúc trước tháng bắt đầu", "अन्त्य महिना सुरु भन्दा अघि छ"], "말일": ["последний день", "ngày cuối", "अन्तिम दिन"], "예)": ["Напр.", "VD:", "उदाहरण:"], "① 금액 입력": ["① Сумма", "① Nhập số tiền", "① रकम लेख्नुहोस्"], "맨 위 숫자를 누르면 숫자 키패드가 떠요. 쓴 돈을 입력해요.": ["Нажмите на число вверху — откроется клавиатура. Введите потраченную сумму.", "Chạm vào số ở trên cùng để mở bàn phím số, rồi nhập số tiền đã tiêu.", "माथिको अङ्क थिच्दा किप्याड खुल्छ। खर्च गरेको रकम लेख्नुहोस्।"], "점심 9,000원 → 9000 입력": ["Обед 9 000 ₩ → введите 9000", "Bữa trưa 9.000₩ → nhập 9000", "दिउँसोको खाना ₩9,000 → 9000 लेख्नुहोस्"], "② 카테고리 고르기": ["② Категория", "② Chọn danh mục", "② वर्ग छान्नुहोस्"], "카테고리 칸을 누르면 아래에 세부 항목(외식·카페 등)이 나와요. 세부 항목은 안 골라도 돼요.": ["Нажмите категорию — ниже появятся подпункты (кафе, ресторан…). Подпункт выбирать не обязательно.", "Chạm danh mục để hiện mục con (ăn ngoài, cà phê…) bên dưới. Không bắt buộc chọn mục con.", "वर्ग थिच्दा तल उप-वस्तु (बाहिर खाना, क्याफे…) देखिन्छ। उप-वस्तु छान्नु जरुरी छैन।"], "🍚 식비 → 외식": ["🍚 Еда → Рестораны", "🍚 Ăn uống → Ăn ngoài", "🍚 खाना → बाहिर खाना"], "📅 날짜 바꾸기": ["📅 Дата", "📅 Đổi ngày", "📅 मिति बदल्नुहोस्"], "기본은 오늘이에요. 눌러서 어제나 다른 날로 바꿀 수 있어요.": ["По умолчанию — сегодня. Нажмите, чтобы выбрать вчера или другой день.", "Mặc định là hôm nay. Chạm để đổi sang hôm qua hoặc ngày khác.", "पूर्वनिर्धारित आज हो। थिचेर हिजो वा अर्को दिन छान्नुहोस्।"], "어제 산 택시비 → 📅 → 어제": ["Вчерашнее такси → 📅 → Вчера", "Taxi hôm qua → 📅 → Hôm qua", "हिजोको ट्याक्सी → 📅 → हिजो"], "📝 상세": ["📝 Подробно", "📝 Chi tiết", "📝 विवरण"], "품목명·브랜드·구매처·수량을 적어요. 수량 옆에서 개·g·kg·ml·L를 골라요. 적어 두면 비교 탭에서 단가를 볼 수 있어요.": ["Укажите товар, бренд, магазин и количество, рядом выберите шт·г·кг·мл·л. Тогда во вкладке «Сравнение» видна цена за единицу.", "Ghi tên món, thương hiệu, cửa hàng và số lượng, chọn cái·g·kg·ml·L bên cạnh. Sau đó xem đơn giá ở tab So sánh.", "सामान, ब्रान्ड, पसल र परिमाण लेख्नुहोस्, छेउमा थान·g·kg·ml·L छान्नुहोस्। अनि तुलना ट्याबमा एकाइ मूल्य देखिन्छ।"], "돼지고기 · 마트 · 600 g": ["Свинина · магазин · 600 г", "Thịt heo · siêu thị · 600 g", "सुँगुरको मासु · मार्ट · 600 g"], "③ 기록하기": ["③ Записать", "③ Ghi lại", "③ रेकर्ड गर्नुहोस्"], "맨 아래 버튼을 누르면 저장돼요. 잘못 눌렀으면 아래 알림의 [되돌리기]를 누르세요.": ["Нажмите нижнюю кнопку, чтобы сохранить. Если ошиблись — нажмите [Отменить] в уведомлении.", "Bấm nút dưới cùng để lưu. Nếu nhầm, bấm [Hoàn tác] trong thông báo bên dưới.", "तलको बटन थिचेर सेभ गर्नुहोस्। गल्ती भए तलको सूचनामा [पूर्ववत्] थिच्नुहोस्।"], "🍚 식비 · 외식 9,000원 기록": ["🍚 Еда · Рестораны 9 000 ₩ записано", "🍚 Ăn uống · Ăn ngoài 9.000₩ đã ghi", "🍚 खाना · बाहिर खाना ₩9,000 रेकर्ड"], "⭐ 즐겨찾기 · 🔁 반복 지출": ["⭐ Избранное · 🔁 Повторы", "⭐ Yêu thích · 🔁 Định kỳ", "⭐ मनपर्ने · 🔁 दोहोरिने"], "자주 쓰는 기록은 ⭐ 즐겨찾기 추가, 매달 나가는 돈은 🔁 반복 지출 추가. 반복 지출은 시작·종료 달을 정하면 그날 자동으로 기록돼요.": ["Частые записи — ⭐ в избранное, ежемесячные платежи — 🔁 повтор. Укажите месяцы начала и конца, и запись появится сама в нужный день.", "Ghi chép hay dùng → ⭐ thêm yêu thích; khoản trả hằng tháng → 🔁 thêm định kỳ. Đặt tháng bắt đầu và kết thúc, đến ngày sẽ tự ghi.", "बारम्बारको रेकर्ड ⭐ मनपर्नेमा, मासिक खर्च 🔁 दोहोरिनेमा थप्नुहोस्। सुरु र अन्त्य महिना राखे त्यो दिन आफैं रेकर्ड हुन्छ।"], "월세 55만원 · 매달 25일 · 2026.01~2026.12": ["Аренда 550 000 ₩ · 25-го · 2026.01~2026.12", "Tiền nhà 550.000₩ · ngày 25 · 2026.01~2026.12", "भाडा ₩550,000 · हरेक २५ गते · 2026.01~2026.12"], "📅 달력": ["📅 Календарь", "📅 Lịch", "📅 पात्रो"], "날짜를 누르면 아래에 그날 기록이 나와요. 숫자는 그날 쓴 돈, 그림은 한 푼도 안 쓴 무지출 날이에요. 무지출 그림은 위쪽 그림을 눌러 바꿔요.": ["Нажмите дату — ниже появятся записи. Числа — траты за день, значок — дни без трат. Значок меняется нажатием сверху.", "Chạm ngày để xem ghi chép bên dưới. Số là tiền đã tiêu, biểu tượng là ngày không chi. Chạm biểu tượng phía trên để đổi.", "मिति थिच्दा तल त्यो दिनको रेकर्ड देखिन्छ। अङ्क खर्च हो, चित्र खर्च नभएको दिन। माथिको चित्र थिचेर बदल्नुहोस्।"], "이번 달 무지출 6일": ["6 дней без трат в этом месяце", "6 ngày không chi tháng này", "यो महिना ६ दिन खर्च छैन"], "✏️ 기록 고치기": ["✏️ Исправить записи", "✏️ Sửa ghi chép", "✏️ रेकर्ड सच्याउनुहोस्"], "기록을 누르면 수정, 꾹 누르면 여러 개를 고를 수 있어요. 고른 뒤 [삭제] [카테고리 변경] [합치기]를 눌러요.": ["Нажмите запись, чтобы изменить; удерживайте, чтобы выбрать несколько. Затем [Удалить], [Сменить категорию] или [Объединить].", "Chạm để sửa, nhấn giữ để chọn nhiều. Rồi bấm [Xóa], [Đổi danh mục] hoặc [Gộp].", "रेकर्ड थिच्दा सम्पादन, थिचिराख्दा धेरै छान्न सकिन्छ। अनि [मेटाउनुहोस्] [वर्ग बदल्नुहोस्] [जोड्नुहोस्] थिच्नुहोस्।"], "커피 2건을 꾹 눌러 고르고 → 합치기": ["Удерживайте 2 кофе → Объединить", "Nhấn giữ 2 ly cà phê → Gộp", "दुई कफी थिचिराखेर छान्नुहोस् → जोड्नुहोस्"], "📊 분석": ["📊 Анализ", "📊 Phân tích", "📊 विश्लेषण"], "위 버튼으로 지출 · 예산 · 비교를 바꿔 봐요. 지출은 주간·월간·분기·연간 원형 차트, 조각을 누르면 그 기록 목록이 나와요.": ["Переключайте «Расходы · Бюджет · Сравнение» вверху. Расходы — круговая диаграмма за неделю–год; нажмите сектор, чтобы увидеть записи.", "Chuyển Chi tiêu · Ngân sách · So sánh ở trên. Chi tiêu là biểu đồ tròn theo tuần đến năm; chạm phần để xem danh sách.", "माथिबाट खर्च · बजेट · तुलना बदल्नुहोस्। खर्चमा हप्ता–वर्षको पाइ चार्ट छ; टुक्रा थिच्दा रेकर्ड सूची आउँछ।"], "이번 달 식비가 몇 %인지 보기": ["Узнать, какой % месяца ушёл на еду", "Xem ăn uống chiếm bao nhiêu % tháng này", "यो महिना खानामा कति % गयो हेर्नुहोस्"], "🎯 예산": ["🎯 Бюджет", "🎯 Ngân sách", "🎯 बजेट"], "[＋ 예산 등록]으로 대분류나 카테고리에 월간·분기·연간 예산을 만들어요. 대분류 예산은 그 안 카테고리 예산 합계 이상이에요. 줄을 누르면 하위 예산, 꾹 누르면 수정해요.": ["[＋ Добавить бюджет] — месячный, квартальный или годовой бюджет для группы или категории. Бюджет группы не меньше суммы её категорий. Нажмите строку — подбюджеты, удерживайте — изменить.", "Dùng [＋ Thêm ngân sách] để đặt ngân sách tháng, quý, năm cho nhóm hoặc danh mục. Ngân sách nhóm ít nhất bằng tổng các danh mục. Chạm dòng để xem ngân sách con, nhấn giữ để sửa.", "[＋ बजेट थप्नुहोस्] बाट समूह वा वर्गको मासिक, त्रैमासिक, वार्षिक बजेट बनाउनुहोस्। समूह बजेट भित्रका वर्गको जम्मा भन्दा कम हुँदैन। पङ्क्ति थिच्दा उप-बजेट, थिचिराख्दा सम्पादन।"], "변동지출 월 80만원 · 그 안에 식비 40만원": ["Переменные 800 000 ₩/мес · из них еда 400 000 ₩", "Biến đổi 800.000₩/tháng · trong đó ăn uống 400.000₩", "परिवर्तनशील ₩800,000/महिना · त्यसमा खाना ₩400,000"], "🔍 비교": ["🔍 Сравнение", "🔍 So sánh", "🔍 तुलना"], "마트에서 가격과 용량을 넣으면 100g당·개당 가격으로 바꿔서 가장 싼 것에 👍를 달아요. 위에서 품목을 누르면 예전에 산 가격과도 비교해요.": ["В магазине введите цену и объём — увидите цену за 100 г или за штуку, самая дешёвая получит 👍. Нажмите товар выше, чтобы сравнить с прошлыми покупками.", "Ở siêu thị, nhập giá và dung tích để xem giá mỗi 100g hoặc mỗi cái; rẻ nhất được 👍. Chạm món ở trên để so với giá đã mua trước.", "पसलमा मूल्य र परिमाण लेखे प्रति 100g वा प्रति थान मूल्य देखिन्छ, सबैभन्दा सस्तोमा 👍। माथिको सामान थिचे पहिले किनेको मूल्यसँग पनि तुलना हुन्छ।"], "A 8,900원 500g  vs  B 15,800원 1kg": ["A 8 900 ₩ 500 г  vs  B 15 800 ₩ 1 кг", "A 8.900₩ 500g  vs  B 15.800₩ 1kg", "A ₩8,900 500g  vs  B ₩15,800 1kg"], "🛍️ 사고 싶은 것": ["🛍️ Хочу купить", "🛍️ Muốn mua", "🛍️ किन्न चाहेको"], "이름·금액·카테고리를 넣고 ＋를 눌러요. 다 사면 그 예산이 얼마 남는지(여유)·넘는지(초과) 보여줘요. 샀으면 동그라미를 눌러 바로 기록해요.": ["Введите название, цену и категорию и нажмите ＋. Видно, сколько останется или будет перерасход, если купить всё. Купили — нажмите кружок, чтобы записать.", "Nhập tên, giá, danh mục rồi bấm ＋. Ứng dụng cho biết nếu mua hết thì ngân sách còn dư hay vượt bao nhiêu. Đã mua thì chạm vòng tròn để ghi.", "नाम, मूल्य, वर्ग लेखेर ＋ थिच्नुहोस्। सबै किने बजेट कति बाँकी वा बढी हुन्छ देखाउँछ। किनेपछि गोलो थिचेर रेकर्ड गर्नुहोस्।"], "겨울 코트 189,000원 → 생활": ["Зимнее пальто 189 000 ₩ → Быт", "Áo khoác 189.000₩ → Sinh hoạt", "जाडोको कोट ₩189,000 → जीवन"], "⚙️ 설정": ["⚙️ Настройки", "⚙️ Cài đặt", "⚙️ सेटिङ"], "테마·무늬·앱 아이콘·🔒 앱 잠금·백업을 바꿔요. 이 사용법은 설정 맨 아래 📖 사용법 보기로 다시 볼 수 있어요.": ["Меняйте тему, узор, значок, 🔒 блокировку и копии. Эту инструкцию можно открыть снова: 📖 «Как пользоваться» внизу настроек.", "Đổi giao diện, hoa văn, biểu tượng, 🔒 khóa và sao lưu. Xem lại hướng dẫn này ở 📖 Cách dùng cuối Cài đặt.", "थिम, बुट्टा, एप आइकन, 🔒 एप लक र ब्याकअप बदल्नुहोस्। सेटिङको तल 📖 प्रयोग विधिबाट यो फेरि हेर्न सकिन्छ।"], "앱 잠금 → 비밀번호 4자리": ["Блокировка → PIN из 4 цифр", "Khóa ứng dụng → mã PIN 4 số", "एप लक → ४ अङ्कको PIN"], "📱 위젯": ["📱 Виджеты", "📱 Tiện ích", "📱 विजेट"], "홈 화면 빈 곳을 꾹 누르고 위젯 → 쉬운가계부에서 지출·사고 싶은 것 위젯을 놓아요. 위젯을 꾹 누르면 설정을 바꿀 수 있어요.": ["Удерживайте пустое место на главном экране → Виджеты → Easy Budget и добавьте виджет расходов или списка покупок. Удерживайте виджет, чтобы изменить настройки.", "Nhấn giữ chỗ trống trên màn hình chính → Tiện ích → Easy Budget, đặt tiện ích Chi tiêu hoặc Muốn mua. Nhấn giữ tiện ích để đổi cài đặt.", "होम स्क्रिनको खाली ठाउँ थिचिराख्नुहोस् → विजेट → Easy Budget, खर्च वा किन्न चाहेको विजेट राख्नुहोस्। विजेट थिचिराखेर सेटिङ बदल्नुहोस्।"], "지출 위젯 → 변동지출 · 월간": ["Виджет расходов → Переменные · Месяц", "Tiện ích chi tiêu → Biến đổi · Tháng", "खर्च विजेट → परिवर्तनशील · मासिक"], "최근": ["Последняя", "Gần nhất", "पछिल्लो"], "🔁 반복 지출 수정": ["🔁 Сохранить повтор", "🔁 Lưu định kỳ", "🔁 दोहोरिने सेभ"], "반복 지출을 수정했어요": ["Повтор изменён", "Đã sửa định kỳ", "दोहोरिने खर्च सच्याइयो"], "묶음 예산": ["Общие бюджеты", "Ngân sách gộp", "संयुक्त बजेट"], "＋ 여러 개 묶기": ["＋ Объединить несколько", "＋ Gộp nhiều mục", "＋ धेरै मिलाउनुहोस्"], "묶을 항목": ["Что объединить", "Mục cần gộp", "मिलाउने वस्तुहरू"]};

    if (S.editId) { const day = S.start; Object.assign(db.exps.find(e => e.id === S.editId), x); save(); toast('수정했어요'); clearForm(); S.calSel = day; return setTab('calendar'); }

  else if (d.act === 'cancelEdit') { const back = S.fromWish ? 'plan' : 'calendar'; clearForm(); return setTab(back); }

    if (a === 'spickOff') { f.pick = null; return render(); }
    if (a === 'pickDel') { delExps(f.pick); f.pick = null; return render(); }
    if (a === 'pickCat') { S.sheet = { type: 'recat', ids: [...f.pick], back: f }; return render(); }
    if (a === 'merge') { const id = mergeExps(f.pick); S.sheet = null; return openEditExp(id); }

    return render();
  }
  const d = b.dataset;

    if (d.act === 'moveCancel') f.moving = null;
    else if (d.moveto) { const from = f.moving, to = d.moveto, snap = JSON.stringify(db), n = db.exps.filter(e => e.cat === from).length;
      [...db.exps, ...db.favs, ...db.wishes].forEach(x => { if (x.cat === from) x.cat = to; });
      db.cats = db.cats.filter(c => c.id !== from); db.budgets = db.budgets.filter(x => x.target !== from); save();
      f.moving = null; if (f.editId === from) Object.assign(f, { editId: null, name: '', subs: '' });
      toast(`기록 ${n}건을 ${CAT(to).name}(으)로 옮기고 삭제했어요`, () => { db = JSON.parse(snap); save(); }); }

// ---- 꾹 눌러서 순서 바꾸기: [data-sortlist] 안의 [data-sortkey]를 길게 누른 뒤 끌어서 옮긴다
let drag = null, noClick = false;
function sortStart(el, x, y) {
  drag = { el, list: el.closest('[data-sortlist]'), x, y };
  drag.timer = setTimeout(() => { if (!drag) return;
    if (!el.dataset.sortkey) { drag = null; noClick = true; setTimeout(() => { noClick = false; }, 450); try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} return onLongPress(el.dataset.lp); }
    drag.on = true; el.classList.add('dragging'); drag.list.classList.add('sorting'); try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} }, 380);
}
function sortMove(x, y, ev) {
  if (!drag) return;
  if (!drag.on) { if (Math.abs(x - drag.x) + Math.abs(y - drag.y) > 10) { clearTimeout(drag.timer); drag = null; } return; }
  ev.preventDefault();
  const over = document.elementFromPoint(x, y), t = over && over.closest('[data-sortkey]');
  // 카테고리는 다른 대분류 칸으로도 옮길 수 있다
  const isCat = drag.list.dataset.sortlist.startsWith('cats:'), ol = over && over.closest('[data-sortlist^="cats:"]');
  if (isCat && ol && ol !== drag.el.parentNode && (!t || t.parentNode === ol)) { ol.insertBefore(drag.el, t || null); drag.moved = true; return; }
  if (!t || t === drag.el || t.parentNode !== drag.el.parentNode) return;
  const items = [...t.parentNode.querySelectorAll('[data-sortkey]')], i = items.indexOf(drag.el), j = items.indexOf(t);
  t.parentNode.insertBefore(drag.el, i < j ? t.nextSibling : t); drag.moved = true;
}
function sortEnd() {
  if (!drag) return; clearTimeout(drag.timer);
  const d = drag; drag = null;
  if (!d.on) return;
  noClick = true; setTimeout(() => { noClick = false; }, 350);
  const [type, id] = d.list.dataset.sortlist.split(':'), keys = [...d.list.querySelectorAll('[data-sortkey]')].map(x => x.dataset.sortkey);

  ['calendar', 'main .card + .card', '✏️ 기록 고치기', '기록을 누르면 수정, 꾹 누르면 여러 개를 고를 수 있어요. 고른 뒤 [삭제] [카테고리 변경] [합치기]를 눌러요.', '커피 2건을 꾹 눌러 고르고 → 합치기'],
  ['analysis', '.seg', '📊 분석', '위 버튼으로 지출 · 예산 · 비교를 바꿔 봐요. 지출은 주간·월간·분기·연간 원형 차트, 조각을 누르면 그 기록 목록이 나와요.', '이번 달 식비가 몇 %인지 보기', 'spend'],
  ['analysis', '[data-act=beNew]', '🎯 예산', '[＋ 예산 등록]으로 대분류나 카테고리에 월간·분기·연간 예산을 만들어요. 대분류 예산은 그 안 카테고리 예산 합계 이상이에요. 줄을 누르면 하위 예산, 꾹 누르면 수정해요.', '변동지출 월 80만원 · 그 안에 식비 40만원', 'budget'],

];
let TU = -1;
function tutStart() { TU = 0; S.sheet = null; tutDraw(); }
function tutDraw() {
  const box = $('#tut');
  if (TU < 0 || TU >= TUT.length) { TU = -1; box.innerHTML = ''; PREF.tutDone = 1; savePref(); return setTab('record'); }
  const [tab, sel, title, text, ex, view] = TUT[TU];
  if (view) S.anaView = view;
  setTab(tab);
  const el = sel && document.querySelector(sel);
  if (el) el.scrollIntoView({ block: 'center' });
  const r = el ? el.getBoundingClientRect() : null, H = innerHeight, below = r && r.bottom + 230 < H;
  box.innerHTML = `<div class="blk"></div>${r ? `<div class="hl" style="left:${r.left - 6}px;top:${r.top - 6}px;width:${r.width + 12}px;height:${r.height + 12}px"></div>` : '<div class="hl" style="left:50%;top:50%;width:0;height:0"></div>'}
  <div class="bub" style="${r ? (below ? `top:${r.bottom + 16}px` : r.top > 250 ? `bottom:${H - r.top + 16}px` : 'bottom:84px') : 'top:35%'}">
    <div style="font-weight:800;font-size:16px;margin-bottom:4px">${title}</div>
    <div style="line-height:1.5">${text}</div>
    <div class="muted" style="margin-top:6px;font-size:13px"><span>예)</span> <span>${ex}</span></div>
    <div class="between" style="margin-top:12px"><button class="link muted" data-tut="skip">건너뛰기</button>
      <span><span class="muted" style="margin-right:10px">${TU + 1}/${TUT.length}</span><button class="btn sm" data-tut="next">${TU === TUT.length - 1 ? '시작하기' : '다음'}</button></span></div></div>`;
  trNode(box);
}
$('#tut').addEventListener('click', ev => { const b = ev.target.closest('[data-tut]'); if (!b) return; TU = b.dataset.tut === 'skip' ? TUT.length : TU + 1; tutDraw(); });

load();
if (location.hash === '#spend') { S.tab = 'analysis'; S.anaView = 'spend'; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'analysis')); }
if (location.hash === '#budget') { S.tab = 'analysis'; S.anaView = 'budget'; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'analysis')); }
if (location.hash === '#settings') { S.tab = 'settings'; history.replaceState(null, '', location.pathname); document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'settings')); }
if (location.hash === '#calendar') { S.tab = 'calendar'; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'calendar')); }
if (location.hash === '#wish') { S.tab = 'plan'; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'plan')); }
render();
importPending(); pushWidget();
if (PREF.lock && PREF.pinH) showLock('unlock');
</script>
